openapi: 3.1.0
info:
  title: ExpenseClaim API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    ExpenseClaim の MVP API 契約。

    承認フローは「社員 -> 課長 -> 経理最終承認」に固定する。経理権限は role ではなく、
    ユーザーが経理部署に所属しているかどうかで判定する。
servers:
  - url: https://api.expenseclaim.test
    description: API base URL
tags:
  - name: auth
    description: 認証と現在ユーザー情報。
  - name: users
    description: ユーザー参照。
  - name: departments
    description: 部署参照。
  - name: expenseClaims
    description: 経費申請と承認操作。
  - name: attachments
    description: 領収書などの添付ファイル。
  - name: auditLogs
    description: 操作監査ログ。
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: メールアドレスとパスワードでログインし、JWT と Refresh Token を発行する。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh tokens
      description: request body の Refresh Token を検証し、新しい JWT と Refresh Token を発行する。
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      description: 現在の Refresh Token を失効させる。Bearer JWT が必要。
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Logout succeeded.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/me:
    get:
      tags:
        - auth
      summary: Get current user
      description: Bearer JWT から現在のユーザーと部署情報を返す。
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users:
    get:
      tags:
        - users
      summary: List users
      description: ユーザー一覧を返す。経費申請者や承認者の選択に利用する。
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}:
    get:
      tags:
        - users
      summary: Get user
      description: 指定したユーザーを返す。
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /departments:
    get:
      tags:
        - departments
      summary: List departments
      description: 部署一覧を返す。経理権限は role ではなく部署所属で判定する。
      operationId: listDepartments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Department list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /departments/{departmentId}:
    get:
      tags:
        - departments
      summary: Get department
      description: 指定した部署を返す。
      operationId: getDepartment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      responses:
        "200":
          description: Department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims:
    get:
      tags:
        - expenseClaims
      summary: List expense claims
      description: |
        経費申請一覧を返す。社員は自分の申請、課長は承認対象、経理部署所属ユーザーは
        経理最終承認対象を参照できる。
      operationId: listExpenseClaims
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExpenseClaimStatus"
        - name: applicantUserId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Expense claim list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExpenseClaim"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - expenseClaims
      summary: Create expense claim
      description: 社員が下書きの経費申請を作成する。
      operationId: createExpenseClaim
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseClaimCreateRequest"
      responses:
        "201":
          description: Expense claim created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseClaim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}:
    get:
      tags:
        - expenseClaims
      summary: Get expense claim
      description: 指定した経費申請を返す。
      operationId: getExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Expense claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseClaim"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - expenseClaims
      summary: Update expense claim
      description: 下書きまたは差し戻し状態の経費申請を更新する。
      operationId: updateExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseClaimUpdateRequest"
      responses:
        "200":
          description: Expense claim updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseClaim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - expenseClaims
      summary: Delete expense claim
      description: 下書きの経費申請を削除する。
      operationId: deleteExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "204":
          description: Expense claim deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/submit:
    post:
      tags:
        - expenseClaims
      summary: Submit expense claim
      description: 社員が下書きまたは差し戻し状態の申請を課長承認待ちに進める。
      operationId: submitExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/cancel:
    post:
      tags:
        - expenseClaims
      summary: Cancel expense claim
      description: 社員が申請を取り消す。任意コメントを requestBody で送信できる。
      operationId: cancelExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCommentRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/manager-approve:
    post:
      tags:
        - expenseClaims
      summary: Manager approve expense claim
      description: 課長が申請を承認し、経理最終承認待ちに進める。任意コメントを requestBody で送信できる。
      operationId: managerApproveExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCommentRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/accounting-approve:
    post:
      tags:
        - expenseClaims
      summary: Accounting approve expense claim
      description: |
        経理部署に所属するユーザーが申請を最終承認する。任意コメントを requestBody
        で送信できる。経理権限は role ではなく部署所属で判定する。
      operationId: accountingApproveExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCommentRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/send-back:
    post:
      tags:
        - expenseClaims
      summary: Send back expense claim
      description: |
        課長または経理部署所属ユーザーが申請を申請者へ差し戻す。
        差し戻し理由として comment は必須。
      operationId: sendBackExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/reject:
    post:
      tags:
        - expenseClaims
      summary: Reject expense claim
      description: |
        課長または経理部署所属ユーザーが申請を却下する。
        却下理由として comment は必須。
      operationId: rejectExpenseClaim
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExpenseClaimActionSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/attachments:
    post:
      tags:
        - attachments
      summary: Upload attachment
      description: PDF、PNG、JPEG の領収書ファイルを multipart/form-data でアップロードする。
      operationId: uploadAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF、PNG、JPEG のいずれかのファイル。
            encoding:
              file:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        "201":
          description: Attachment uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/attachments/{attachmentId}/download:
    get:
      tags:
        - attachments
      summary: Download attachment
      description: 添付ファイルをダウンロードする。
      operationId: downloadAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment file.
          headers:
            Content-Disposition:
              description: Download filename.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /expense-claims/{claimId}/attachments/{attachmentId}:
    delete:
      tags:
        - attachments
      summary: Delete attachment
      description: 下書きまたは差し戻し状態の経費申請から添付ファイルを削除する。
      operationId: deleteAttachment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204":
          description: Attachment deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /audit-logs:
    get:
      tags:
        - auditLogs
      summary: List audit logs
      description: |
        操作監査ログを返す。経理部署所属ユーザーが参照する API。
        経理権限は role ではなく部署所属で判定する。
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          schema:
            type: string
            maxLength: 100
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit log list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ExpenseClaimActionSucceeded:
      description: Expense claim action succeeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExpenseClaim"
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, expired, or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Unsupported media type. Attachments accept only PDF, PNG, and JPEG.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Bearer JWT.
        refreshToken:
          type: string
          description: Refresh Token. `/auth/refresh` の request body で再発行に利用する。
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: JWT 再発行または logout 対象の Refresh Token。
    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - isAccountingDepartmentMember
          properties:
            isAccountingDepartmentMember:
              type: boolean
              description: 経理権限判定結果。role ではなく部署所属から算出する。
    User:
      type: object
      required:
        - id
        - email
        - name
        - department
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        department:
          $ref: "#/components/schemas/Department"
        managerUserId:
          type:
            - string
            - "null"
          format: uuid
          description: 課長承認者の候補となる上長ユーザー ID。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Department:
      type: object
      description: 経理権限は専用 role ではなく、ユーザーが経理部署に所属するかで判定する。
      required:
        - id
        - code
        - name
        - isAccounting
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        isAccounting:
          type: boolean
          description: true の部署に所属するユーザーを経理権限ありとして扱う。
    ExpenseClaim:
      type: object
      description: |
        経費申請。承認フローは「社員 -> 課長 -> 経理最終承認」に固定する。
      required:
        - id
        - applicant
        - title
        - status
        - items
        - totalAmount
        - attachments
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        applicant:
          $ref: "#/components/schemas/User"
        title:
          type: string
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000
        status:
          $ref: "#/components/schemas/ExpenseClaimStatus"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseItem"
        totalAmount:
          type: integer
          minimum: 0
          description: 明細金額の合計。通貨は JPY。
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
        managerApprovedAt:
          type:
            - string
            - "null"
          format: date-time
        accountingApprovedAt:
          type:
            - string
            - "null"
          format: date-time
          description: 経理部署所属ユーザーによる最終承認日時。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExpenseClaimCreateRequest:
      type: object
      required:
        - title
        - items
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseItemInput"
    ExpenseClaimUpdateRequest:
      type: object
      description: 下書きまたは差し戻し状態の申請だけ更新できる。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 1000
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseItemInput"
      minProperties: 1
    ExpenseClaimStatus:
      type: string
      description: |
        固定承認フローの状態。社員が `submitted` に進め、課長承認後に
        `manager_approved`、経理部署所属ユーザーの最終承認後に
        `accounting_approved` になる。
      enum:
        - draft
        - submitted
        - manager_approved
        - accounting_approved
        - sent_back
        - rejected
        - canceled
    ExpenseItem:
      type: object
      required:
        - id
        - expenseDate
        - category
        - amount
        - description
      properties:
        id:
          type: string
          format: uuid
        expenseDate:
          type: string
          format: date
        category:
          type: string
          maxLength: 100
        amount:
          type: integer
          minimum: 1
          description: 明細金額。通貨は JPY。
        description:
          type: string
          minLength: 1
          maxLength: 500
    ExpenseItemInput:
      type: object
      description: 経費申請の作成・更新で送信する明細入力。
      required:
        - expenseDate
        - category
        - amount
        - description
      properties:
        expenseDate:
          type: string
          format: date
        category:
          type: string
          maxLength: 100
        amount:
          type: integer
          minimum: 1
          description: 明細金額。通貨は JPY。
        description:
          type: string
          minLength: 1
          maxLength: 500
    ApprovalCommentRequest:
      type: object
      description: |
        承認または取消で任意コメントを送る。
        経理最終承認は role ではなく経理部署所属ユーザーだけが実行できる。
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    ApprovalReasonRequest:
      type: object
      description: |
        差し戻しまたは却下で必須理由を送る。
        経理部署所属ユーザーによる差し戻しと却下は role ではなく部署所属で判定する。
      required:
        - comment
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    Attachment:
      type: object
      description: PDF、PNG、JPEG の添付ファイルメタデータ。
      required:
        - id
        - claimId
        - fileName
        - contentType
        - sizeBytes
        - uploadedBy
        - uploadedAt
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum:
            - application/pdf
            - image/png
            - image/jpeg
        sizeBytes:
          type: integer
          minimum: 1
        uploadedBy:
          $ref: "#/components/schemas/User"
        uploadedAt:
          type: string
          format: date-time
    AuditLog:
      type: object
      required:
        - id
        - actor
        - action
        - resourceType
        - resourceId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actor:
          $ref: "#/components/schemas/User"
        action:
          type: string
          maxLength: 100
        resourceType:
          type: string
          maxLength: 100
        resourceId:
          type: string
          format: uuid
        detail:
          type:
            - object
            - "null"
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
        - page
        - perPage
        - totalCount
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 1000
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"
    ValidationErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          maxLength: 255
        message:
          type: string
          maxLength: 1000
