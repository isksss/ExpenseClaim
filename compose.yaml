services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: expenseclaim
      POSTGRES_USER: expenseclaim
      POSTGRES_PASSWORD: expenseclaim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseclaim -d expenseclaim"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
